name: checkstyle

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    outputs:
      run_linux: ${{ steps.gate.outputs.run_linux }}
    steps:
      - uses: actions/checkout@v4
      - name: Gate Linux checks off the macOS-port tree
        id: gate
        run: |
          # checkstyle does a full Linux ./configure && make. The macOS-port
          # tree (module/os/macos present) is not maintained to build on Linux
          # and is validated by macos-build.yaml instead. Skip when macOS
          # sources are present.
          if [ -d module/os/macos ]; then
            echo "run_linux=false" | tee -a "$GITHUB_OUTPUT"
          else
            echo "run_linux=true" | tee -a "$GITHUB_OUTPUT"
          fi

  checkstyle:
    needs: [ gate ]
    if: ${{ needs.gate.outputs.run_linux == 'true' }}
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Install dependencies
      run: |
        # for x in lxd core20 snapd; do sudo snap remove $x; done
        sudo apt-get purge -y snapd google-chrome-stable firefox
        ONLY_DEPS=1 .github/workflows/scripts/qemu-3-deps-vm.sh ubuntu22
        sudo apt-get install -y cppcheck devscripts mandoc pax-utils shellcheck
        sudo python -m pipx install --quiet flake8
        # confirm that the tools are installed
        # the build system doesn't fail when they are not
        checkbashisms --version
        cppcheck --version
        flake8 --version
        scanelf --version
        shellcheck --version
    - name: Prepare
      run: |
        sed -i '/DEBUG_CFLAGS="-Werror"/s/^/#/' config/zfs-build.m4
        ./autogen.sh
    - name: Configure
      run: |
        ./configure
    - name: Make
      run: |
        make -j$(nproc) --no-print-directory --silent
    - name: Checkstyle
      run: |
        make -j$(nproc) --no-print-directory --silent checkstyle
    - name: Lint
      run: |
        make -j$(nproc) --no-print-directory --silent lint
    - name: CheckABI
      id: CheckABI
      run: |
        docker run -v $PWD:/source ghcr.io/openzfs/libabigail make -j$(nproc) --no-print-directory --silent checkabi
    - name: StoreABI
      if: failure() && steps.CheckABI.outcome == 'failure'
      run: |
        docker run -v $PWD:/source ghcr.io/openzfs/libabigail make -j$(nproc) --no-print-directory --silent storeabi
    - name: Prepare artifacts
      if: failure() && steps.CheckABI.outcome == 'failure'
      run: |
        find -name *.abi | tar -cf abi_files.tar -T -
    - uses: actions/upload-artifact@v4
      if: failure() && steps.CheckABI.outcome == 'failure'
      with:
        name: New ABI files (use only if you're sure about interface changes)
        path: abi_files.tar
